# Servidor de pruebas (VPS con Plesk). Lo lee desplegar-vps.sh en cada actualización.
# Para enseñar el desarrollo a colaboradores.
S360_DOMINIO=administrador.hamenorca.com
# Semillero de áreas y recursos (semillero/semillero.json): si = completo · sin-personas = sin los
# operarios (demostración) · no = no se carga. Se vuelve a cargar cuando cambia el archivo.
S360_SEMILLERO=si
# Borrar el proyecto de ejemplo de la instalación (PR-001) antes de cargar el semillero
S360_LIMPIAR_DEMO=si
