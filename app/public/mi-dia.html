<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="s360">
  <title>s360 · Mi día</title>
  <link rel="stylesheet" href="styles.css?v=202611181021">
</head>
<body class="midia-pant">
  <header class="md-cab">
    <div class="md-quien">
      <b id="md-nombre"></b>
      <span class="md-titulo-vista" id="titulo-vista" hidden></span>
      <nav class="md-fecha" id="nav-fecha" aria-label="Cambiar día">
        <button type="button" id="dia-ant" aria-label="Día anterior">‹</button>
        <span id="fecha-txt"></span>
        <button type="button" id="dia-sig" aria-label="Día siguiente">›</button>
      </nav>
    </div>
    <div class="md-cab-acc">
      <a class="boton ghost" id="mis-pantallas" href="/" hidden title="Volver a mis pantallas">☰</a>
      <button type="button" class="ghost" id="ajustes-avisos" aria-label="Avisos" title="Avisos">🔔</button>
      <button type="button" class="ghost" id="cambiar-pin" aria-label="Cambiar mi PIN" title="Cambiar mi PIN">🔑</button>
      <button type="button" class="ghost" id="salir">Salir</button>
    </div>
  </header>

  <main class="md-main" id="v-dia">
    <div id="instalar" class="pwa-caja"></div>
    <div id="activar-avisos" class="pwa-caja"></div>
    <p class="md-resumen" id="resumen"></p>
    <p class="md-aviso" id="aviso" hidden></p>
    <div id="tramos"></div>

    <section class="md-bloque" aria-labelledby="tit-extra">
      <h2 id="tit-extra">Trabajo no planificado</h2>
      <ul class="md-extra" id="extra"></ul>
      <button type="button" class="md-mas" id="extra-abrir">+ Añadir (otra tarea, desplazamiento, espera…)</button>
      <form id="form-extra" class="md-form-extra" hidden>
        <div class="md-tipo" role="radiogroup" aria-label="Qué fue">
          <label><input type="radio" name="tipo" value="productivo" checked> En una tarea</label>
          <label><input type="radio" name="tipo" value="no_productivo"> No productivo</label>
        </div>
        <select name="tarea_id" aria-label="Tarea"></select>
        <select name="motivo" aria-label="Qué hiciste" hidden></select>
        <div class="md-horas">
          <label>De <input name="desde" type="time" step="900" required></label>
          <label>a <input name="hasta" type="time" step="900" required></label>
        </div>
        <input name="notas" maxlength="500" placeholder="Nota (opcional)" aria-label="Nota">
        <div class="md-acciones">
          <button type="button" class="ghost" id="extra-cancelar">Cancelar</button>
          <button type="submit" class="primario">Añadir</button>
        </div>
      </form>
    </section>

    <section class="md-bloque" id="bloque-manana" hidden aria-labelledby="tit-manana">
      <h2 id="tit-manana">Lo siguiente</h2>
      <ul class="md-manana" id="manana"></ul>
    </section>

    <div class="md-enviar">
      <button type="button" class="primario" id="enviar">Enviar mi día</button>
      <p class="ayuda" id="enviar-txt"></p>
    </div>
  </main>

  <!-- Mi mes -->
  <main class="md-main" id="v-mes" hidden>
    <nav class="md-mes-nav" aria-label="Cambiar mes">
      <button type="button" id="mes-ant" aria-label="Mes anterior">‹</button>
      <b id="mes-txt"></b>
      <button type="button" id="mes-sig" aria-label="Mes siguiente">›</button>
    </nav>
    <p class="md-resumen" id="mes-total"></p>
    <ul class="md-mes" id="mes-dias"></ul>
  </main>

  <!-- Vacaciones -->
  <main class="md-main" id="v-vac" hidden>
    <div class="md-saldo" id="vac-saldo"></div>
    <section class="md-bloque">
      <h2>Pedir vacaciones</h2>
      <form id="form-vac" class="md-form">
        <div class="md-horas">
          <label>Desde <input type="date" name="desde" required></label>
          <label>Hasta <input type="date" name="hasta" required></label>
        </div>
        <p class="md-previa" id="vac-previa" aria-live="polite"></p>
        <input name="notas" maxlength="500" placeholder="Nota (opcional)" aria-label="Nota">
        <button type="submit" class="primario md-grande">Pedir</button>
        <p class="ayuda">Primero da el visto bueno Operaciones y después lo aprueba RRHH. Te saldrá aquí.</p>
      </form>
    </section>
    <section class="md-bloque">
      <h2>Mis peticiones</h2>
      <ul class="md-lista" id="vac-lista"></ul>
    </section>
  </main>

  <!-- Avisar -->
  <main class="md-main" id="v-avisar" hidden>
    <section class="md-bloque" id="bloque-justif" hidden>
      <h2>Justificantes pendientes</h2>
      <ul class="md-lista" id="justif-lista"></ul>
    </section>
    <section class="md-bloque">
      <h2>No vengo o llego tarde</h2>
      <form id="form-aus" class="md-form">
        <div class="md-chips" id="aus-motivos" role="radiogroup" aria-label="Qué pasa"></div>
        <div class="md-horas">
          <label>Día <input type="date" name="desde" required></label>
          <label>Hasta <input type="date" name="hasta" aria-label="Hasta (si son varios días)"></label>
        </div>
        <div class="md-tipo" role="radiogroup" aria-label="Cuánto">
          <label><input type="radio" name="cuanto" value="dia" checked> Todo el día</label>
          <label><input type="radio" name="cuanto" value="horas"> Unas horas</label>
        </div>
        <div class="md-horas" id="aus-horas" hidden>
          <label>De <input type="time" name="hora_desde" step="900"></label>
          <label>a <input type="time" name="hora_hasta" step="900"></label>
        </div>
        <input name="notas" maxlength="500" placeholder="Nota (opcional)" aria-label="Nota">
        <div class="md-fotos" id="aus-fotos"></div>
        <button type="submit" class="primario md-grande">Avisar al encargado</button>
      </form>
    </section>
    <section class="md-bloque">
      <h2>Mis avisos</h2>
      <ul class="md-lista" id="mis-avisos"></ul>
    </section>
  </main>

  <!-- Capturar: a la bandeja -->
  <main class="md-main" id="v-capturar" hidden></main>

  <!-- Mi perfil -->
  <main class="md-main" id="v-perfil" hidden></main>
  <!-- Logística en el móvil: revisar stock y recibir material -->
  <main class="md-main" id="v-stock" hidden></main>
  <!-- Mis capacidades -->
  <main class="md-main" id="v-caps" hidden></main>
  <!-- Barra inferior: Mi día · Menú (todo) · Capturar -->
  <nav class="md-tabs md-tabs3" aria-label="Secciones">
    <button type="button" data-vista="dia" aria-current="page"><span aria-hidden="true">📋</span>Mi día</button>
    <button type="button" id="md-menu-btn" class="md-menu-btn" aria-haspopup="dialog" aria-label="Menú"><span aria-hidden="true">☰</span><i id="md-menu-punto" hidden></i>Menú</button>
    <button type="button" data-vista="capturar"><span aria-hidden="true">＋</span>Capturar</button>
  </nav>
  <dialog id="md-menu" class="md-menu" aria-label="Menú">
    <div class="md-menu-asa" aria-hidden="true"></div>
    <div class="md-menu-grid" id="md-menu-grid"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="pwa.js?v=202611181021"></script>
  <script src="comun.js?v=202611181021"></script>
  <script src="ayuda-textos.js?v=202611181021"></script>
  <script src="ayuda.js?v=202611181021"></script>
  <script src="captura.js?v=202611181021"></script>
  <script src="mi-dia-mas.js?v=202611181021"></script>
  <script src="mi-dia-stock.js?v=202611181021"></script>
  <script src="mi-dia-menu.js?v=202611181021"></script>
  <script src="mi-dia.js?v=202611181021"></script>
</body>
</html>
